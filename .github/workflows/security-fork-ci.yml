name: Security fork CI

on:
  push:
    branches:
      - security/fix-infinite-loop-dos
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: yarn install --immutable
      - name: Check security regression test formatting
        run: yarn biome check specs/security.spec.ts
      - name: Inherited repository lint baseline
        continue-on-error: true
        run: yarn lint
      - run: yarn build
      - run: yarn test
